      toast('Avisos desativados neste celular');
    });
    const prefs = $('a-av-prefs');
    if (prefs) prefs.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      const n = { ...CONFIG_PADRAO.notif, ...(state.config.notif || {}) };
      if (b.dataset.venc) n.vencidas = b.getAttribute('aria-checked') !== 'true';
      else {
        const v = Number(b.dataset.dia);
        n.dias = n.dias.includes(v) ? n.dias.filter(d => d !== v) : n.dias.concat(v).sort((a, c) => c - a);
      }
      b.setAttribute('aria-checked', b.dataset.venc ? n.vencidas : n.dias.includes(Number(b.dataset.dia)));
      state.config = { ...state.config, notif: n };
      gravar('config');
    });
  }

  // ---------- Aparência (cor, tema, layout) ----------
  // Fica guardada neste aparelho; o script no <head> aplica antes de desenhar a página.
  const LS_APARENCIA = 'contas-a-pagar-aparencia';
  const CORES = [
    { id: 'verde', nome: 'Verde', amostra: '#0e5c56' },
    { id: 'azul', nome: 'Azul', amostra: '#1f4fa8' },
    { id: 'roxo', nome: 'Roxo', amostra: '#5b3ea8' },
    { id: 'vinho', nome: 'Vinho', amostra: '#8f2a45' },
    { id: 'grafite', nome: 'Grafite', amostra: '#2f3a40' },
  ];
  const TEMAS = [{ id: 'auto', nome: 'Automático' }, { id: 'claro', nome: 'Claro' }, { id: 'escuro', nome: 'Escuro' }];
  const LAYOUTS = [
    { id: 'cupom', nome: 'Cupom', icone: '<i><b style="height:9px"></b><b></b><b></b></i>' },
    { id: 'cartoes', nome: 'Cartões', icone: '<i style="gap:4px"><b style="height:6px"></b><b style="height:6px"></b></i>' },
    { id: 'compacto', nome: 'Compacto', icone: '<i><b style="height:2px"></b><b style="height:2px"></b><b style="height:2px"></b><b style="height:2px"></b></i>' },
  ];
  const TEXTOS = [
    { id: 'normal', nome: 'Normal', amostra: '15px' },
    { id: 'grande', nome: 'Grande', amostra: '17px' },
    { id: 'maior', nome: 'Maior', amostra: '19px' },
  ];
  const APARENCIA_PADRAO = { cor: 'verde', tema: 'auto', layout: 'cupom', texto: 'normal' };
  const lerAparencia = () => { try { return { ...APARENCIA_PADRAO, ...JSON.parse(lsGet(LS_APARENCIA) || '{}') }; } catch (e) { return { ...APARENCIA_PADRAO }; } };
  function aplicarAparencia(a) {
    const r = document.documentElement;
    if (a.cor && a.cor !== 'verde') r.dataset.cor = a.cor; else delete r.dataset.cor;
    if (a.tema === 'claro') r.dataset.theme = 'light'; else if (a.tema === 'escuro') r.dataset.theme = 'dark'; else delete r.dataset.theme;
    if (a.layout && a.layout !== 'cupom') r.dataset.layout = a.layout; else delete r.dataset.layout;
    if (a.texto && a.texto !== 'normal') r.dataset.texto = a.texto; else delete r.dataset.texto;
    // Cor da barra do sistema no celular acompanha o cabeçalho.
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = getComputedStyle(r).getPropertyValue('--accent').trim() || '#0e5c56';
  }
  function htmlAparencia() {
    const a = lerAparencia();
    return `<h2>Aparência</h2>
      <div class="field"><span class="lbl" id="lbl-cor">Cor</span>
        <div class="cores" role="radiogroup" aria-labelledby="lbl-cor" id="ap-cor">
          ${CORES.map(c => `<button type="button" class="cor-btn" role="radio" data-v="${c.id}" aria-checked="${a.cor === c.id}" aria-label="${c.nome}" title="${c.nome}" style="background:${c.amostra}"></button>`).join('')}
        </div>
      </div>
      <div class="field"><span class="lbl" id="lbl-tema">Tema</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-tema" id="ap-tema">
          ${TEMAS.map(t => `<button type="button" role="radio" data-v="${t.id}" aria-checked="${a.tema === t.id}">${t.nome}</button>`).join('')}
        </div>
      </div>
      <div class="field"><span class="lbl" id="lbl-texto">Tamanho do texto</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-texto" id="ap-texto">
          ${TEXTOS.map(t => `<button type="button" role="radio" data-v="${t.id}" aria-checked="${a.texto === t.id}" style="font-size:${t.amostra}">${t.nome}</button>`).join('')}
        </div>
      </div>
      <div class="field"><span class="lbl" id="lbl-lay">Layout</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-lay" id="ap-layout">
          ${LAYOUTS.map(l => `<button type="button" class="lay" role="radio" data-v="${l.id}" aria-checked="${a.layout === l.id}">${l.icone}${l.nome}</button>`).join('')}
        </div>
        <span class="note">A aparência vale só para este aparelho.</span>
      </div>
      <hr class="dash" style="margin:2px 0">`;
  }
  function ligarAparencia() {
    [['ap-cor', 'cor'], ['ap-tema', 'tema'], ['ap-texto', 'texto'], ['ap-layout', 'layout']].forEach(([id, chave]) => {
      $(id).addEventListener('click', e => {
        const b = e.target.closest('button[data-v]'); if (!b) return;
        const a = { ...lerAparencia(), [chave]: b.dataset.v };
        lsSet(LS_APARENCIA, JSON.stringify(a));
        $(id).querySelectorAll('button[data-v]').forEach(x => x.setAttribute('aria-checked', x === b));
        aplicarAparencia(a);
      });
    });
  }

  function abrirAjustes() {
    const ub = state.config.ultimoBackup;
    const diasBackup = ub ? diaNum(isoHoje()) - diaNum(ub) : null;
    const backupEmDia = ub && diasBackup <= 30;
    abrirFolha(`
      ${cabecalho('Ajustes')}
      ${modo === 'conta' && usuario ? `
        <div class="status on"><i></i><span>Conectado como <b>${esc(usuario.email || usuario.nome)}</b>. Suas contas ficam salvas na sua conta e aparecem em qualquer aparelho em que você entrar.</span></div>
        <button class="btn ghost" id="a-sair">Sair da conta</button>
        <hr class="dash" style="margin:2px 0">`
      : window.Nuvem && Nuvem.configurado ? `
        <div class="status"><i></i><span>Você está usando sem conta: as contas ficam só neste celular.</span></div>
        <button class="btn" id="a-entrar">Entrar ou criar conta</button>
        <hr class="dash" style="margin:2px 0">` : ''}
      ${htmlAvisos()}
      ${htmlAparencia()}
      <h2>Suas categorias</h2>
      <div class="cat-lista" id="a-cats">${htmlListaCategorias()}</div>
      <button type="button" class="btn ghost" id="a-nova-cat" aria-expanded="false">+ Nova categoria</button>
      <div id="a-editor-cat" hidden>${htmlEditorCategoria('a')}</div>
      <hr class="dash" style="margin:2px 0">
      <div class="field"><label for="a-renda">Renda mensal</label>
        <div class="amount-wrap"><span>R$</span><input class="amount" id="a-renda" inputmode="numeric" autocomplete="off" style="font-size:26px" value="${((state.config.renda || 0) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}"></div>
        <span class="note">Opcional. Mostra quanto sobra depois das contas de cada mês. Use 0,00 para não mostrar.</span>
      </div>
      <button class="btn" id="a-salvar">Salvar renda</button>
      <hr class="dash" style="margin:2px 0">
      <h2>Backup</h2>
      <div class="status ${backupEmDia ? 'on' : ''}"><i></i><span>${!armazenamentoOk ? 'Este navegador não está conseguindo guardar as contas. Faça um backup agora.' : ub ? `Último backup em ${ub.split('-').reverse().join('/')}${backupEmDia ? '' : ', há mais de 30 dias'}.` : 'Você ainda não fez nenhum backup.'}</span></div>
      <p class="note" style="margin:0">${modo === 'conta' ? 'Com a conta suas contas já ficam protegidas. O backup é uma cópia extra, se quiser.' : 'As contas ficam guardadas só neste celular.'} Guarde o arquivo de backup no Google Drive, no e-mail ou no WhatsApp para não perder nada se trocar de aparelho ou limpar o navegador.</p>
      <button class="btn" id="a-backup">Fazer backup</button>
      <button class="btn ghost" id="a-restaurar">Restaurar de um backup</button>
      <input type="file" id="a-arquivo" accept="application/json,.json" hidden>
      <div id="a-confirma" hidden></div>
      <hr class="dash" style="margin:2px 0">
      <button class="btn ghost" id="a-csv">Baixar planilha (CSV)</button>
      ${temExemplos() ? `<button class="btn danger" id="a-ex">Remover dados de exemplo</button>` : ''}
    `, () => {
      const renda = mascaraValor($('a-renda'), state.config.renda || 0, 10);
      $('a-salvar').addEventListener('click', () => { state.config = { ...state.config, renda: renda() }; gravar('config'); fecharFolha(); render(); toast('Renda atualizada'); });
      const sair = $('a-sair');
      if (sair) sair.addEventListener('click', async () => {
        if (!sair.classList.contains('armed')) { sair.classList.add('armed', 'danger'); sair.textContent = 'Toque para confirmar a saída'; return; }
        fecharFolha();
        // Quem entrar depois neste celular não deve receber os avisos desta conta.
        if (idAvisoLocal()) { try { await Nuvem.desativarAvisos(usuario.uid, idAvisoLocal()); } catch (e) {} lsSet(LS_AVISO, null); }
        await Nuvem.sair();
      });
      ligarAvisos();
      ligarAparencia();
      $('a-nova-cat').addEventListener('click', () => {
        const ed = $('a-editor-cat');
        ed.hidden = !ed.hidden;
        $('a-nova-cat').setAttribute('aria-expanded', !ed.hidden);
        if (!ed.hidden) $('a-cat-nome').focus();
      });
      ligarEditorCategoria('a', cat => {
        $('a-cats').innerHTML = htmlListaCategorias();
        $('a-editor-cat').hidden = true;
        toast(`Categoria ${cat.nome} criada`);
      });
      $('a-cats').addEventListener('click', e => {
        const b = e.target.closest('button[data-excluir]'); if (!b) return;
        if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Confirmar'; return; }
        const cat = catOf(b.dataset.excluir);
        state.config = { ...state.config, categorias: catsPessoais().filter(c => c.id !== b.dataset.excluir) };
        gravar('config');
        $('a-cats').innerHTML = htmlListaCategorias();
        render();
        toast(`Categoria ${cat.nome} excluída. As contas dela aparecem em Outros.`);
      });
      const entrar = $('a-entrar');
      if (entrar) entrar.addEventListener('click', () => { lsSet(LS_SEM_CONTA, null); abrirLogin(); });
      $('a-backup').addEventListener('click', async () => { await fazerBackup(); fecharFolha(); render(); });
      $('a-restaurar').addEventListener('click', () => $('a-arquivo').click());
      $('a-arquivo').addEventListener('change', () => {
        const f = $('a-arquivo').files[0];
        if (!f) return;
        const leitor = new FileReader();
        leitor.onload = () => {
          const box = $('a-confirma');
          box.hidden = false;
          let dados;
          try { dados = lerBackup(String(leitor.result)); }
          catch (e) {
            box.innerHTML = `<div class="err">Este arquivo não é um backup do Contas a Pagar. Escolha o arquivo "backup-contas-….json".</div>`;
            return;
          }
          const n = Object.values(dados.meses).flat().length;
          const quando = dados.criadoEm ? new Date(dados.criadoEm).toLocaleDateString('pt-BR') : 'data desconhecida';
          box.innerHTML = `<div class="status" style="display:grid;gap:10px">
            <span>Backup de ${esc(quando)} com ${n} conta${n === 1 ? '' : 's'}. ${temDados() ? 'As contas que estão neste celular serão substituídas.' : ''}</span>
            <div class="sheet-actions"><button class="btn" id="a-sub">Restaurar</button><button class="btn ghost" id="a-cancela">Cancelar</button></div>
          </div>`;
          $('a-cancela').addEventListener('click', () => { box.hidden = true; box.innerHTML = ''; $('a-arquivo').value = ''; });
          $('a-sub').addEventListener('click', () => {
            substituirTudo(dados);
            estenderFixas();
            mesAtual = mesDe(isoHoje());
            fecharFolha(); render();
            toast(`${n} conta${n === 1 ? '' : 's'} restaurada${n === 1 ? '' : 's'}`);
          });
        };
        leitor.readAsText(f);
      });
      const ex = $('a-ex');
      if (ex) ex.addEventListener('click', () => { removerExemplos(); fecharFolha(); toast('Exemplos removidos'); });
      $('a-csv').addEventListener('click', () => {
        const br = iso => iso ? iso.split('-').reverse().join('/') : '';
        const linhas = [['Vencimento', 'Descrição', 'Categoria', 'Tipo', 'Parcela', 'Valor', 'Situação', 'Pago em', 'Pagar com']];
        todas().sort((a, b) => a.venc.localeCompare(b.venc)).forEach(i => linhas.push([
          br(i.venc), i.desc, catOf(i.cat).nome, i.tipo === 'fixa' ? 'Fixa' : i.tipo === 'parcelada' ? 'Parcelada' : 'Avulsa',
          i.parcelas ? `${i.parcela}/${i.parcelas}` : '', (i.valor / 100).toFixed(2).replace('.', ','), i.pago ? 'Paga' : situacao(i).k === 'vencida' ? 'Vencida' : 'A pagar', br(i.pagoEm), i.pag]));
        const texto = '﻿' + linhas.map(l => l.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
        baixarArquivo(`contas-a-pagar-${isoHoje()}.csv`, texto, 'text/csv;charset=utf-8');
        toast('Planilha salva em Downloads');
      });
    });
  }

  let toastTimer;
  function toast(msg, acao, fn) {
    clearTimeout(toastTimer);
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.innerHTML = `<span>${esc(msg)}</span>${acao ? `<button>${esc(acao)}</button>` : ''}`;
    if (acao) t.querySelector('button').addEventListener('click', () => { fn(); t.remove(); });
    toastTimer = setTimeout(() => t.remove(), acao ? 5000 : 2600);
  }

  // ---------- Eventos ----------
  $('prev').addEventListener('click', () => { mesAtual = addMes(mesAtual, -1); aba = 'mes'; render(); });
  $('next').addEventListener('click', () => { mesAtual = addMes(mesAtual, 1); aba = 'mes'; render(); });
  $('ir-hoje').addEventListener('click', () => { mesAtual = mesDe(isoHoje()); render(); });
  $('tab-mes').addEventListener('click', () => { aba = 'mes'; render(); });
  $('tab-prox').addEventListener('click', () => { aba = 'prox'; render(); });
  $('fab').addEventListener('click', () => abrirConta());
  $('btn-config').addEventListener('click', abrirAjustes);
  const acharConta = el => itensDo(el.dataset.mes).find(i => i.id === (el.dataset.id || el.dataset.pagar));
  ['view-mes', 'view-prox'].forEach(v => $(v).addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'novo') abrirConta();
      if (act.dataset.act === 'exemplos') carregarExemplos();
      if (act.dataset.act === 'restaurar') { abrirAjustes(); $('a-arquivo').click(); }
      return;
    }
    const chk = e.target.closest('[data-pagar]');
    if (chk) { const c = acharConta(chk); if (c) alternarPaga(c); return; }
    const it = e.target.closest('[data-id]');
    if (it) { const c = acharConta(it); if (c) abrirConta(c); }
  }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharFolha(); });

  // Se a pessoa já tinha entrado, espera as contas da conta em vez de mostrar o celular vazio.
  if (lsGet(LS_SESSAO) === '1') carregando = true; else lerLocal();
  estenderFixas();
  render();
  aplicarAparencia(lerAparencia());
  pedirPersistencia();
  const aoNuvemPronta = () => {
    if (window.Nuvem && Nuvem.configurado) { conectarNuvem(); return; }
    // Sem Firebase configurado (ou sem internet no primeiro acesso): segue com o que está no celular.
    if (carregando) { carregando = false; lerLocal(); estenderFixas(); render(); }
  };
  if (window.Nuvem) aoNuvemPronta(); else window.addEventListener('nuvem-pronta', aoNuvemPronta, { once: true });
  // Atualiza os avisos de vencimento quando o app volta para a tela no dia seguinte.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { estenderFixas(); render(); } });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
