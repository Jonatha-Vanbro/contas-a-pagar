<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contas">
<meta name="description" content="Controle de contas a pagar: vencimentos, contas fixas e parceladas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Contas a Pagar</title>
<meta name="theme-color" content="#0e5c56">
<script>
  // Aparência escolhida em Ajustes (cor, tema e layout). Aplicada antes de desenhar a página para não piscar.
  try {
    const a = JSON.parse(localStorage.getItem('contas-a-pagar-aparencia') || '{}');
    const r = document.documentElement;
    if (a.cor) r.dataset.cor = a.cor;
    if (a.tema === 'claro') r.dataset.theme = 'light';
    if (a.tema === 'escuro') r.dataset.theme = 'dark';
    if (a.layout) r.dataset.layout = a.layout;
    if (a.texto && a.texto !== 'normal') r.dataset.texto = a.texto;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de uma coluna (máx. 480px), cabeçalho fixo com o mês, abas embaixo e botão flutuante para cadastrar conta. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-2: #e3e9e8;
  --fg: #142321;
  --muted: #5b6d6a;
  --line: #d3dcda;
  --accent: #0e5c56;
  --accent-fg: #ffffff;
  --accent-soft: #d4ebe7;
  --ok: #1f7a4a;
  --warn: #a8670a;
  --bad: #b3261e;
  --c-moradia: #7a4fb0;
  --c-energia: #b8860b;
  --c-agua: #2a62b8;
  --c-internet: #12808f;
  --c-cartao: #c2571a;
  --c-emprestimo: #8a5a3c;
  --c-impostos: #4d5f8a;
  --c-educacao: #2f7d4f;
  --c-saude: #c23a5e;
  --c-outros: #6d7774;
  --shadow: 0 10px 30px rgba(14, 40, 37, .14);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1716; --surface: #15211f; --surface-2: #1d2b29; --fg: #e6efed; --muted: #93a7a3; --line: #2a3a37;
    --accent: #5cc4b5; --accent-fg: #06201d; --accent-soft: #173733;
    --ok: #5ccf8c; --warn: #e6a640; --bad: #ff8a80;
    --c-moradia: #b28ae6; --c-energia: #e3b440; --c-agua: #6f9cf0; --c-internet: #4cc3d1; --c-cartao: #f08a4b;
    --c-emprestimo: #d39a74; --c-impostos: #94a6d6; --c-educacao: #62c288; --c-saude: #f07896; --c-outros: #9aa5a2;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1716; --surface: #15211f; --surface-2: #1d2b29; --fg: #e6efed; --muted: #93a7a3; --line: #2a3a37;
  --accent: #5cc4b5; --accent-fg: #06201d; --accent-soft: #173733;
  --ok: #5ccf8c; --warn: #e6a640; --bad: #ff8a80;
  --c-moradia: #b28ae6; --c-energia: #e3b440; --c-agua: #6f9cf0; --c-internet: #4cc3d1; --c-cartao: #f08a4b;
  --c-emprestimo: #d39a74; --c-impostos: #94a6d6; --c-educacao: #62c288; --c-saude: #f07896; --c-outros: #9aa5a2;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.app { max-width: 480px; margin: 0 auto; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Cabeçalho */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--accent); color: var(--accent-fg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 14px; }
.top-row { display: flex; align-items: center; gap: 8px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; flex: 1; min-width: 0; }
.brand small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; opacity: .78; letter-spacing: .02em; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: color-mix(in srgb, var(--accent-fg) 14%, transparent); color: inherit; display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }
.month-nav { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.month-nav .label { flex: 1; text-align: center; font-family: var(--f-display); font-weight: 500; font-size: 17px; }
.month-nav .hoje { border: 0; background: none; color: inherit; font-size: 12px; font-weight: 600; opacity: .85; text-decoration: underline; padding: 0 4px; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; display: grid; gap: 18px; }

/* Resumo do mês, com borda picotada de boleto */
.cupom { background: var(--surface); border-radius: 4px; padding: 18px 18px 16px; position: relative; box-shadow: var(--shadow); }
.cupom::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: radial-gradient(circle at 8px 8px, transparent 6px, var(--surface) 6.5px) 0 0 / 16px 8px repeat-x; }
.eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.total { font-family: var(--f-num); font-weight: 700; font-size: clamp(30px, 9vw, 40px); line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.budget-line { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 12px; flex-wrap: wrap; }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--ok); transition: width .4s ease; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--fg); }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.dash { border: 0; border-top: 1.5px dashed var(--line); margin: 14px 0 12px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats div { min-width: 0; }
.stats b { display: block; font-family: var(--f-num); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats b.neg { color: var(--bad); }
.stats span { font-size: 11px; color: var(--muted); }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 17px; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h2 .cnt { font-family: var(--f-num); font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px; }
.note { font-size: 13px; color: var(--muted); }

/* Contas */
.items { background: var(--surface); border-radius: 14px; overflow: hidden; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; }
.item + .item { border-top: 1px solid var(--line); }
.item.vencida { box-shadow: inset 3px 0 0 var(--bad); }
.check { width: 44px; height: 100%; min-height: 60px; border: 0; background: none; display: grid; place-items: center; padding: 0 0 0 8px; }
.check span { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.check span svg { width: 15px; height: 15px; }
.check:hover span { border-color: var(--ok); }
.item.paga .check span { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.abrir { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; border: 0; background: none; text-align: left; padding: 11px 12px 11px 8px; grid-column: 2 / 4; min-width: 0; }
.abrir:active { background: var(--surface-2); }
.item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; min-width: 0; }
.abrir { grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 10px; }
.abrir > .selo { grid-row: 1 / 3; width: 32px; height: 32px; border-radius: 10px; }
[data-texto] .stats b { white-space: normal; }
.selo { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; color: var(--cc); background: color-mix(in srgb, var(--cc) 16%, transparent); }
.chip .selo { width: 22px; height: 22px; border-radius: 6px; margin-left: -4px; }
.chip-nova { border-style: dashed; color: var(--accent); }
.editor-cat { display: grid; gap: 12px; margin-top: 10px; padding: 14px; border-radius: 14px; background: var(--surface-2); }
.editor-cat .input { background: var(--surface); }
.icones { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.ico-btn { height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; padding: 0; }
.ico-btn[aria-checked="true"] { border-color: var(--fg); background: var(--accent-soft); color: var(--accent); }
.cor-btn.cor-btn-p { width: 34px; height: 34px; }
.toggle small { display: block; font-weight: 500; margin-top: 2px; }
.toggle input { flex: none; align-self: flex-start; margin-top: 1px; }
.cat-lista { display: grid; gap: 6px; }
.cat-linha { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); font-weight: 600; }
.cat-linha span.n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-linha button { border: 0; background: none; color: var(--bad); font-weight: 600; font-size: 13px; padding: 6px 4px; }
.item.paga .selo { opacity: .6; }
.aprox { color: var(--warn); margin-right: 2px; }
.a-confirmar { color: var(--warn); font-weight: 600; }
.item .t em { font-style: normal; overflow: hidden; text-overflow: ellipsis; }
.item .v { font-family: var(--f-num); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
.item.paga .v, .item.paga .t em { color: var(--muted); }
.item .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st { font-size: 12px; font-weight: 600; text-align: right; white-space: nowrap; }
.st.vencida { color: var(--bad); } .st.hoje, .st.logo { color: var(--warn); } .st.paga { color: var(--ok); } .st.aberta { color: var(--muted); }
.tag-ex { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); flex: none; }

.empty { background: var(--surface); border-radius: 14px; padding: 28px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty h3 { font-family: var(--f-display); font-size: 19px; margin: 0; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; background: var(--accent); color: var(--accent-fg); min-height: 46px; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.danger { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* Próximos */
.chart { background: var(--surface); border-radius: 14px; padding: 16px 12px 12px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.chart .val { fill: var(--fg); font-family: var(--f-num); font-size: 10px; font-weight: 700; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; padding: 0 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.lr { width: 14px; height: 0; border-radius: 0; border-top: 2px dashed var(--muted); }

/* Abas e botão flutuante */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-right: 76px; }
.tab { border: 0; background: none; padding: 8px 6px; border-radius: 10px; font-size: 12px; font-weight: 600; color: var(--muted); display: grid; justify-items: center; gap: 2px; position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
.tab .dot { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: var(--surface); font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; font-family: var(--f-num); }
.fab { position: fixed; z-index: 7; right: max(16px, calc((100vw - 480px) / 2 + 16px), env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: 60px; height: 60px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow); display: grid; place-items: center; }
.fab svg { width: 28px; height: 28px; }

/* Folha inferior */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(5, 15, 14, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; border-radius: 22px 22px 0 0;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(18px + env(safe-area-inset-bottom, 0px));
  animation: subir .22s ease-out; display: grid; gap: 14px; }
@keyframes subir { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 0 auto 2px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { font-size: 19px; }
.close { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--surface-2); display: grid; place-items: center; }
.close svg { width: 18px; height: 18px; }
.amount-wrap { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; display: flex; align-items: baseline; gap: 8px; }
.amount-wrap span { font-family: var(--f-num); font-weight: 700; color: var(--muted); font-size: 20px; }
.amount { border: 0; background: none; width: 100%; min-width: 0; font-family: var(--f-num); font-weight: 700; font-size: 34px; outline: none; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; min-height: 46px; font-size: 16px; }
.input:focus { border-color: var(--accent); outline: none; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.chip .sw { width: 9px; height: 9px; border-radius: 2px; }
.chip[aria-checked="true"] { border-color: var(--fg); background: var(--surface-2); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 9px 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.toggle { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-weight: 600; }
.toggle input { width: 22px; height: 22px; accent-color: var(--ok); margin: 0; }
.parcela-info { font-size: 13px; font-weight: 600; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; min-height: 1em; }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet-actions .btn { flex: 1 1 140px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.status.on i { background: var(--ok); }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); display: flex; gap: 12px; align-items: center; }
.toast button { border: 0; background: none; color: var(--accent-soft); font-weight: 700; padding: 0; }

/* ---------- Aparência: cores (data-cor), cada uma com versão clara e escura ---------- */
:root[data-cor="azul"] { --accent: #1f4fa8; --accent-fg: #ffffff; --accent-soft: #dbe5f7; }
:root[data-cor="roxo"] { --accent: #5b3ea8; --accent-fg: #ffffff; --accent-soft: #e6defa; }
:root[data-cor="vinho"] { --accent: #8f2a45; --accent-fg: #ffffff; --accent-soft: #f5dde4; }
:root[data-cor="grafite"] { --accent: #2f3a40; --accent-fg: #ffffff; --accent-soft: #e1e6e8; }
@media (prefers-color-scheme: dark) {
  :root[data-cor="azul"]:not([data-theme="light"]) { --accent: #7fa7ee; --accent-fg: #0a1630; --accent-soft: #18264a; }
  :root[data-cor="roxo"]:not([data-theme="light"]) { --accent: #b39cf0; --accent-fg: #170f30; --accent-soft: #2a2147; }
  :root[data-cor="vinho"]:not([data-theme="light"]) { --accent: #ec8fa8; --accent-fg: #2a0a14; --accent-soft: #3d1c27; }
  :root[data-cor="grafite"]:not([data-theme="light"]) { --accent: #c9d3d8; --accent-fg: #12181b; --accent-soft: #263035; }
}
:root[data-cor="azul"][data-theme="dark"] { --accent: #7fa7ee; --accent-fg: #0a1630; --accent-soft: #18264a; }
:root[data-cor="roxo"][data-theme="dark"] { --accent: #b39cf0; --accent-fg: #170f30; --accent-soft: #2a2147; }
:root[data-cor="vinho"][data-theme="dark"] { --accent: #ec8fa8; --accent-fg: #2a0a14; --accent-soft: #3d1c27; }
:root[data-cor="grafite"][data-theme="dark"] { --accent: #c9d3d8; --accent-fg: #12181b; --accent-soft: #263035; }

/* ---------- Aparência: layouts (data-layout) ---------- */
/* Cartões: resumo arredondado sem picote e cada conta em um cartão separado. */
[data-layout="cartoes"] .cupom { border-radius: 18px; }
[data-layout="cartoes"] .cupom::after { display: none; }
[data-layout="cartoes"] .items { background: none; display: grid; gap: 8px; overflow: visible; }
[data-layout="cartoes"] .item { background: var(--surface); border-radius: 14px; overflow: hidden; }
[data-layout="cartoes"] .item + .item { border-top: 0; }
[data-layout="cartoes"] .cats, [data-layout="cartoes"] .chart, [data-layout="cartoes"] .empty { border-radius: 18px; }
/* Compacto: mais contas na tela, resumo menor. */
[data-layout="compacto"] main { gap: 12px; padding-block: 10px; }
[data-layout="compacto"] .cupom { padding: 12px 14px 12px; }
[data-layout="compacto"] .total { font-size: 26px; }
[data-layout="compacto"] .budget-line { margin-top: 6px; }
[data-layout="compacto"] .pills { margin-top: 8px; }
[data-layout="compacto"] .dash { margin: 10px 0 8px; }
[data-layout="compacto"] .section-head { margin-bottom: 4px; }
[data-layout="compacto"] h2 { font-size: 15px; }
[data-layout="compacto"] .check { min-height: 46px; }
[data-layout="compacto"] .check span { width: 22px; height: 22px; }
[data-layout="compacto"] .abrir { padding-block: 7px; }
[data-layout="compacto"] .item .t, [data-layout="compacto"] .item .v { font-size: 14px; }
[data-layout="compacto"] .item .s, [data-layout="compacto"] .st { font-size: 11px; }
[data-layout="compacto"] .month-nav { margin-top: 6px; }
[data-layout="compacto"] .top { padding-block: 8px 10px; }

/* Tamanho do texto: aumenta a página inteira por igual (letras, botões e espaços). */
:root[data-texto="grande"] { zoom: 1.12; }
:root[data-texto="maior"] { zoom: 1.25; }

/* Seletores da seção Aparência */
.cores { display: flex; flex-wrap: wrap; gap: 10px; }
.cor-btn { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); padding: 0; }
.cor-btn[aria-checked="true"] { box-shadow: 0 0 0 2.5px var(--fg); }
.seg button.lay { display: grid; justify-items: center; gap: 4px; padding-block: 8px; }
.lay i { display: grid; gap: 2px; width: 30px; }
.lay i b { display: block; height: 4px; border-radius: 2px; background: currentColor; opacity: .55; }

/* Tela de login */
.login { position: fixed; inset: 0; z-index: 25; background: var(--bg); overflow-y: auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: calc(32px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); }
.login-in { max-width: 380px; margin: 0 auto; display: grid; gap: 16px; }
.login-logo { border-radius: 16px; box-shadow: var(--shadow); }
.login h1 { font-family: var(--f-display); font-weight: 700; font-size: 28px; letter-spacing: -.02em; margin: 0; }
.login-sub { margin: -8px 0 0; font-size: 14px; }
.seg.seg-2 { grid-template-columns: 1fr 1fr; }
.login-form { display: grid; gap: 12px; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 8px 0; justify-self: center; }
.ou { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.ou::before, .ou::after { content: ""; border-top: 1px solid var(--line); }
.google { display: flex; align-items: center; justify-content: center; gap: 10px; }
.google svg { width: 20px; height: 20px; }
.btn:disabled { opacity: .6; cursor: default; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">Contas a Pagar<small id="sync-label">Salvo neste celular</small></div>
      <button class="icon-btn" id="btn-config" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="month-nav">
      <button class="icon-btn" id="prev" aria-label="Mês anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="label"><span id="month-label">outubro de 2026</span> <button class="hoje" id="ir-hoje" hidden>voltar a hoje</button></div>
      <button class="icon-btn" id="next" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>

  <main id="view-mes"></main>
  <main id="view-prox" hidden></main>
</div>

<nav class="tabs" aria-label="Seções">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" id="tab-mes" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mês
    </button>
    <button class="tab" role="tab" id="tab-prox" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Próximas<span class="dot" id="dot-venc" hidden>0</span>
    </button>
  </div>
</nav>
<button class="fab" id="fab" aria-label="Cadastrar conta">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div id="layer"></div>

<section class="login" id="tela-login" hidden aria-labelledby="l-titulo">
  <div class="login-in">
    <img src="icons/icon.svg" alt="" width="64" height="64" class="login-logo">
    <h1 id="l-titulo">Contas a Pagar</h1>
    <p class="note login-sub">Entre para guardar suas contas na sua conta e ver em qualquer celular ou computador.</p>
    <div class="seg seg-2" role="radiogroup" aria-label="Entrar ou criar conta" id="l-seg">
      <button type="button" role="radio" data-v="entrar" aria-checked="true">Entrar</button>
      <button type="button" role="radio" data-v="criar" aria-checked="false">Criar conta</button>
    </div>
    <form id="f-login" novalidate class="login-form">
      <div class="field" id="l-box-nome" hidden><label for="l-nome">Seu nome</label><input class="input" id="l-nome" autocomplete="name" maxlength="60"></div>
      <div class="field"><label for="l-email">E-mail</label><input class="input" id="l-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="l-senha">Senha</label><input class="input" id="l-senha" type="password" autocomplete="current-password"><span class="note" id="l-dica-senha" hidden>Pelo menos 6 caracteres.</span></div>
      <div class="err" id="l-msg" role="alert"></div>
      <button type="submit" class="btn" id="l-enviar">Entrar</button>
      <button type="button" class="link" id="l-esqueci">Esqueci minha senha</button>
    </form>
    <div class="ou"><span>ou</span></div>
    <button type="button" class="btn ghost google" id="l-google">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.8 3.6-4.9 6.7-4.9z"/></svg>
      Entrar com Google
    </button>
    <button type="button" class="link" id="l-sem-conta">Usar sem conta, só neste celular</button>
  </div>
</section>

<script type="module" src="nuvem.js"></script>

<script>
(() => {
  // Ícones (traço 24×24) usados nas categorias. As categorias personalizadas escolhem um destes.
  const ICONES = {
    casa: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
    raio: 'M13 2L4 14h7l-1 8 9-12h-7z',
    gota: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',
    wifi: 'M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01',
    cartao: 'M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM2 10h20M6 15h4',
    banco: 'M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18',
    documento: 'M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7',
    capelo: 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5',
    coracao: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',
    etiqueta: 'M4 4h7l9 9-7 7-9-9zM8 8h.01',
    pata: 'M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM16 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM5 14.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM19 14.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM12 13c-3 0-5 3-5 5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2c0-2-2-5-5-5z',
    haltere: 'M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12',
    carro: 'M4 16v-4l2-5h12l2 5v4zM4 16v3M20 16v3M7.5 13h.01M16.5 13h.01',
    carrinho: 'M3 4h2l2.5 11h11L21 8H7M10 20h.01M17 20h.01',
    presente: 'M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0',
    aviao: 'M2 13l20-8-6 15-4-6zM12 14l4-6',
    celular: 'M8 2h8a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM11 18h2',
    estrela: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
    ferramenta: 'M15 4a5 5 0 0 0-4 7l-8 8 2 2 8-8a5 5 0 0 0 7-4l-3 3-3-1-1-3z',
  };
  const icone = (nome, tam = 18) => `<svg viewBox="0 0 24 24" width="${tam}" height="${tam}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONES[nome] || ICONES.etiqueta}"/></svg>`;
  // Cores disponíveis: cada uma é um token com versão clara e escura (--c-<nome>).
  const CORES_CAT = ['moradia', 'energia', 'agua', 'internet', 'cartao', 'emprestimo', 'impostos', 'educacao', 'saude', 'outros'];
  const CATS_BASE = [
    { id: 'moradia', nome: 'Moradia', icone: 'casa', cor: 'moradia' },
    { id: 'energia', nome: 'Energia', icone: 'raio', cor: 'energia' },
    { id: 'agua', nome: 'Água', icone: 'gota', cor: 'agua' },
    { id: 'internet', nome: 'Internet e celular', icone: 'wifi', cor: 'internet' },
    { id: 'cartao', nome: 'Cartão de crédito', icone: 'cartao', cor: 'cartao' },
    { id: 'emprestimo', nome: 'Empréstimo', icone: 'banco', cor: 'emprestimo' },
    { id: 'impostos', nome: 'Impostos', icone: 'documento', cor: 'impostos' },
    { id: 'educacao', nome: 'Educação', icone: 'capelo', cor: 'educacao' },
    { id: 'saude', nome: 'Saúde', icone: 'coracao', cor: 'saude' },
    { id: 'outros', nome: 'Outros', icone: 'etiqueta', cor: 'outros' },
  ];
  // Categorias criadas pela pessoa ficam em state.config.categorias (vão junto com a conta e o backup).
  const catsPessoais = () => (state.config && Array.isArray(state.config.categorias) ? state.config.categorias : []);
  const todasCats = () => CATS_BASE.slice(0, -1).concat(catsPessoais(), CATS_BASE.slice(-1));
  const PAGS = ['Pix', 'Boleto', 'Débito automático', 'Cartão', 'Dinheiro'];
  const MESES_FIXA = 12; // contas fixas ficam sempre lançadas até 12 meses à frente
  const catOf = id => todasCats().find(c => c.id === id) || CATS_BASE[CATS_BASE.length - 1];
  const cor = id => `var(--c-${CORES_CAT.includes(catOf(id).cor) ? catOf(id).cor : 'outros'})`;
  // Selo da categoria: ícone na cor da categoria sobre um fundo claro da mesma cor.
  const selo = (id, tam = 18) => `<span class="selo" style="--cc:${cor(id)}">${icone(catOf(id).icone, tam)}</span>`;

  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const fmt = c => brl.format((c || 0) / 100);
  const fmtCurto = c => {
    const v = (c || 0) / 100;
    if (v >= 1000) return (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
    return Math.round(v).toLocaleString('pt-BR');
  };
  const pad = n => String(n).padStart(2, '0');
  const isoHoje = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const mesDe = iso => iso.slice(0, 7);
  const addMes = (mk, n) => { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const diasNoMes = mk => { const [y, m] = mk.split('-').map(Number); return new Date(y, m, 0).getDate(); };
  // Mesmo dia em outro mês; dia 31 vira o último dia de meses mais curtos.
  const vencEm = (mk, dia) => `${mk}-${pad(Math.min(dia, diasNoMes(mk)))}`;
  const nomeMes = (mk, curto) => { const [y, m] = mk.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('pt-BR', curto ? { month: 'short' } : { month: 'long', year: 'numeric' }).replace('.', ''); };
  const ddmm = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
  const diaNum = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const novoId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function situacao(c) {
    if (c.pago) return { k: 'paga', t: c.pagoEm ? 'Paga em ' + ddmm(c.pagoEm) : 'Paga' };
    const d = diaNum(c.venc) - diaNum(isoHoje());
    if (d < 0) return { k: 'vencida', t: d === -1 ? 'Venceu ontem' : `Venceu há ${-d} dias` };
    if (d === 0) return { k: 'hoje', t: 'Vence hoje' };
    if (d === 1) return { k: 'logo', t: 'Vence amanhã' };
    if (d <= 7) return { k: 'logo', t: `Vence em ${d} dias` };
    return { k: 'aberta', t: 'Vence ' + ddmm(c.venc) };
  }

  // ---------- Estado e armazenamento ----------
  // Sem conta: tudo fica no navegador deste celular (localStorage).
  // Com conta: as contas ficam no Firebase (nuvem.js), que também guarda uma cópia no celular para funcionar offline.
  const LS_KEY = 'contas-a-pagar-v1';
  const LS_SEM_CONTA = 'contas-a-pagar-sem-conta';
  const LS_SESSAO = 'contas-a-pagar-sessao';
  const LS_AVISO = 'contas-a-pagar-aviso';   // "<uid>:<id do aparelho>" quando os avisos estão ativos neste celular
  // notif: quantos dias antes do vencimento avisar (0 = no dia) e se lembra das vencidas. Lido pelo robô em avisos/.
  const CONFIG_PADRAO = { renda: 0, encerradas: [], ultimoBackup: null, notif: { dias: [3, 1, 0], vencidas: true } };
  const state = { config: { ...CONFIG_PADRAO }, meses: {} };
  let armazenamentoOk = true;
  let modo = 'local';          // 'local' ou 'conta'
  let usuario = null;          // { uid, email, nome } quando entrou
  let carregando = false;      // esperando as contas da conta chegarem
  let cancelarAssinatura = null;

  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

  function lerLocalBruto() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      return d && typeof d === 'object' ? { config: { ...CONFIG_PADRAO, ...(d.config || {}) }, meses: d.meses || {} } : null;
    } catch (e) { armazenamentoOk = false; return null; }
  }
  function lerLocal() {
    const d = lerLocalBruto();
    state.config = d ? d.config : { ...CONFIG_PADRAO };
    state.meses = d ? d.meses : {};
  }
  function salvarLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ config: state.config, meses: state.meses })); armazenamentoOk = true; }
    catch (e) {
      armazenamentoOk = false;
      toast('Não foi possível salvar neste celular. Faça um backup agora.');
    }
  }
  // docId: "config" para os ajustes ou "c-AAAA-MM" para as contas de um mês.
  function gravar(docId) {
    if (modo !== 'conta') { salvarLocal(); return; }
    const p = docId === 'config'
      ? Nuvem.gravarAjustes(usuario.uid, { ...state.config })
      : Nuvem.gravarMes(usuario.uid, docId.slice(2), state.meses[docId.slice(2)] || []);
    p.catch(() => toast('Não foi possível salvar na sua conta. Verifique a internet e tente de novo.'));
  }
  // Troca todas as contas e ajustes de uma vez (restaurar backup).
  function substituirTudo(dados) {
    const meses = new Set(Object.keys(state.meses).concat(Object.keys(dados.meses)));
    state.config = dados.config;
    state.meses = dados.meses;
    meses.forEach(mk => gravar('c-' + mk));
    gravar('config');
  }

  // ---------- Conta (login) ----------
  function atualizarRotuloConta() {
    $('sync-label').textContent = modo === 'conta' && usuario ? (usuario.nome || usuario.email || 'Sua conta') : 'Salvo neste celular';
  }

  function aoMudarUsuario(u) {
    if (cancelarAssinatura) { cancelarAssinatura(); cancelarAssinatura = null; }
    if (u) {
      usuario = u;
      modo = 'conta';
      lsSet(LS_SESSAO, '1');
      fecharLogin();
      carregando = true;
      state.meses = {};
      state.config = { ...CONFIG_PADRAO };
      atualizarRotuloConta();
      render();
      let conferiuLocal = false;
      cancelarAssinatura = Nuvem.assinar(u.uid, ({ meses, config, doServidor }) => {
        state.meses = meses;
        state.config = { ...CONFIG_PADRAO, ...(config || {}) };
        carregando = false;
        if (doServidor && !conferiuLocal) { conferiuLocal = true; levarContasDoCelular(); }
        estenderFixas();
        render();
      }, () => { carregando = false; render(); toast('Não foi possível carregar suas contas. Verifique a internet.'); });
    } else {
      const saiu = modo === 'conta';
      usuario = null;
      modo = 'local';
      carregando = false;
      lsSet(LS_SESSAO, null);
      lerLocal();
      atualizarRotuloConta();
      estenderFixas();
      render();
      if (saiu || lsGet(LS_SEM_CONTA) !== '1') abrirLogin();
    }
  }

  // Contas cadastradas antes de entrar (sem conta) vão para a conta.
  function levarContasDoCelular() {
    const local = lerLocalBruto();
    const qtd = local ? Object.values(local.meses).flat().length : 0;
    if (!qtd) return;
    const enviar = () => {
      const ids = new Set(todas().map(c => c.id));
      const tocados = new Set();
      Object.values(local.meses).flat().forEach(c => { if (!ids.has(c.id)) tocados.add(colocar(c)); });
      const enc = new Set(state.config.encerradas.concat(local.config.encerradas || []));
      const idsCat = new Set(catsPessoais().map(c => c.id));
      const categorias = catsPessoais().concat((local.config.categorias || []).filter(c => !idsCat.has(c.id)));
      state.config = { ...state.config, encerradas: [...enc], renda: state.config.renda || local.config.renda || 0, categorias };
      tocados.forEach(mk => gravar('c-' + mk));
      gravar('config');
      lsSet(LS_KEY, null);
      render();
      toast(`${qtd} conta${qtd === 1 ? '' : 's'} deste celular ${qtd === 1 ? 'foi enviada' : 'foram enviadas'} para sua conta`);
    };
    if (!temDados()) { enviar(); return; }
    abrirFolha(`
      ${cabecalho('Contas neste celular')}
      <p style="margin:0">Este celular tem ${qtd} conta${qtd === 1 ? '' : 's'} cadastrada${qtd === 1 ? '' : 's'} sem login. Sua conta já tem outras contas salvas.</p>
      <div class="sheet-actions"><button class="btn" id="m-juntar">Juntar com a minha conta</button></div>
      <div class="sheet-actions"><button class="btn danger" id="m-apagar">Apagar as deste celular</button></div>
    `, () => {
      $('m-juntar').addEventListener('click', () => { fecharFolha(); enviar(); });
      const apagar = $('m-apagar');
      apagar.addEventListener('click', () => {
        if (!apagar.classList.contains('armed')) { apagar.classList.add('armed'); apagar.textContent = 'Toque para confirmar'; return; }
        lsSet(LS_KEY, null); fecharFolha(); toast('Contas deste celular apagadas');
      });
    });
  }

  function abrirLogin() {
    if (!window.Nuvem || !Nuvem.configurado) return;
    fecharFolha();
    const aviso = document.querySelector('.toast'); if (aviso) aviso.remove();
    $('tela-login').hidden = false;
    document.body.style.overflow = 'hidden';
    trocarModoLogin('entrar');
  }
  function fecharLogin() {
    $('tela-login').hidden = true;
    document.body.style.overflow = '';
  }
  let modoLogin = 'entrar';
  function trocarModoLogin(m) {
    modoLogin = m;
    $('l-seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', b.dataset.v === m));
    $('l-box-nome').hidden = m !== 'criar';
    $('l-senha').autocomplete = m === 'criar' ? 'new-password' : 'current-password';
    $('l-enviar').textContent = m === 'criar' ? 'Criar conta' : 'Entrar';
    $('l-esqueci').hidden = m === 'criar';
    $('l-dica-senha').hidden = m !== 'criar';
    $('l-msg').textContent = '';
    $('l-msg').className = 'err';
  }
  function ligarLogin() {
    const msg = (t, ok) => { $('l-msg').textContent = t; $('l-msg').className = ok ? 'note' : 'err'; };
    const ocupado = (b, sim) => { $('l-enviar').disabled = sim; $('l-google').disabled = sim; if (b) b.style.opacity = sim ? .6 : 1; };
    $('l-seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) trocarModoLogin(b.dataset.v); });
    $('f-login').addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('l-email').value.trim(), senha = $('l-senha').value;
      if (!email) { msg('Digite seu e-mail.'); $('l-email').focus(); return; }
      if (!senha) { msg('Digite sua senha.'); $('l-senha').focus(); return; }
      ocupado($('l-enviar'), true);
      msg(modoLogin === 'criar' ? 'Criando sua conta…' : 'Entrando…', true);
      try {
        if (modoLogin === 'criar') {
          const nome = $('l-nome').value.trim();
          await Nuvem.criarConta(email, senha, nome);
          // O nome é gravado logo depois de a conta existir; atualiza o cabeçalho com ele.
          if (nome && usuario) { usuario = { ...usuario, nome }; atualizarRotuloConta(); }
        } else await Nuvem.entrar(email, senha);
        $('l-senha').value = '';
      } catch (err) { msg(err.message); }
      ocupado($('l-enviar'), false);
    });
    $('l-google').addEventListener('click', async () => {
      ocupado($('l-google'), true);
      try { await Nuvem.entrarComGoogle(); } catch (err) { msg(err.message); }
      ocupado($('l-google'), false);
    });
    $('l-esqueci').addEventListener('click', async () => {
      const email = $('l-email').value.trim();
      if (!email) { msg('Digite seu e-mail acima e toque de novo em "Esqueci minha senha".'); $('l-email').focus(); return; }
      try { await Nuvem.recuperarSenha(email); msg(`Enviamos um link para ${email} criar uma nova senha. Confira também o spam.`, true); }
      catch (err) { msg(err.message); }
    });
    $('l-sem-conta').addEventListener('click', () => { lsSet(LS_SEM_CONTA, '1'); fecharLogin(); });
  }

  function conectarNuvem() {
    if (!window.Nuvem || !Nuvem.configurado) return;
    ligarLogin();
    Nuvem.aoMudarUsuario(aoMudarUsuario);
  }

  // Pede ao navegador para não apagar os dados quando faltar espaço.
  function pedirPersistencia() {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  }

  function baixarArquivo(nome, conteudo, tipo) {
    const blob = new Blob([conteudo], { type: tipo });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // Backup: um arquivo .json com todas as contas e ajustes.
  async function fazerBackup() {
    state.config = { ...state.config, ultimoBackup: isoHoje() };
    gravar('config');
    const corpo = JSON.stringify({ app: 'contas-a-pagar', versao: 1, criadoEm: new Date().toISOString(), config: state.config, meses: state.meses }, null, 1);
    const nome = `backup-contas-${isoHoje()}.json`;
    // No celular, a folha de compartilhar permite mandar direto para o Drive, WhatsApp ou e-mail.
    try {
      const arquivo = new File([corpo], nome, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
        await navigator.share({ files: [arquivo], title: 'Backup das contas a pagar' });
        toast('Backup pronto');
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    baixarArquivo(nome, corpo, 'application/json');
    toast('Backup salvo em Downloads');
  }

  function lerBackup(texto) {
    const d = JSON.parse(texto);
    if (!d || d.app !== 'contas-a-pagar' || typeof d.meses !== 'object') throw new Error('formato');
    const meses = {};
    Object.keys(d.meses).forEach(mk => {
      if (/^\d{4}-\d{2}$/.test(mk) && Array.isArray(d.meses[mk]))
        meses[mk] = d.meses[mk].filter(c => c && typeof c.valor === 'number' && /^\d{4}-\d{2}-\d{2}$/.test(c.venc || ''));
    });
    return { config: { ...CONFIG_PADRAO, ...(d.config || {}) }, meses, criadoEm: d.criadoEm };
  }

  // ---------- Operações ----------
  const itensDo = mk => state.meses[mk] || [];
  const todas = () => Object.values(state.meses).flat();
  const totalDe = (mk, f) => itensDo(mk).filter(f || (() => true)).reduce((s, i) => s + i.valor, 0);
  const temDados = () => todas().length > 0;
  const temExemplos = () => todas().some(i => i.exemplo);

  function colocar(c) {
    const mk = mesDe(c.venc);
    state.meses[mk] = itensDo(mk).filter(i => i.id !== c.id).concat(c);
    return mk;
  }
  function tirar(c) {
    const mk = mesDe(c.venc);
    state.meses[mk] = itensDo(mk).filter(i => i.id !== c.id);
    return mk;
  }
  function salvarConta(c, antiga) {
    const tocados = new Set();
    if (antiga) tocados.add(tirar(antiga));
    tocados.add(colocar(c));
    tocados.forEach(mk => gravar('c-' + mk));
  }
  function excluirContas(lista) {
    const tocados = new Set(lista.map(tirar));
    tocados.forEach(mk => gravar('c-' + mk));
  }

  // Cria as próximas ocorrências das contas fixas até MESES_FIXA meses à frente de hoje.
  function estenderFixas() {
    const limite = addMes(mesDe(isoHoje()), MESES_FIXA - 1);
    const ultimas = {};
    todas().forEach(c => {
      if (c.tipo !== 'fixa' || !c.grupo || state.config.encerradas.includes(c.grupo)) return;
      if (!ultimas[c.grupo] || c.venc > ultimas[c.grupo].venc) ultimas[c.grupo] = c;
    });
    const tocados = new Set();
    Object.values(ultimas).forEach(u => {
      let mk = addMes(mesDe(u.venc), 1);
      while (mk <= limite) {
        // Id fixo por grupo e mês: se dois aparelhos criarem a mesma ocorrência, ela não duplica.
        tocados.add(colocar({ id: `${u.grupo}-${mk}`, grupo: u.grupo, tipo: 'fixa', diaVenc: u.diaVenc, desc: u.desc, cat: u.cat, valor: u.valor, pag: u.pag, venc: vencEm(mk, u.diaVenc), pago: false, ...(u.estimado ? { estimado: true } : {}), ...(u.exemplo ? { exemplo: true } : {}) }));
        mk = addMes(mk, 1);
      }
    });
    tocados.forEach(mk => gravar('c-' + mk));
  }

  function criarContas(base, tipo, parcelas) {
    const dia = Number(base.venc.slice(8));
    const mk0 = mesDe(base.venc);
    if (tipo === 'unica') { salvarConta({ ...base, tipo }); return 1; }
    const grupo = 'grp' + novoId();
    const n = tipo === 'fixa' ? 1 : parcelas;
    const tocados = new Set();
    for (let k = 0; k < n; k++) {
      const mk = addMes(mk0, k);
      tocados.add(colocar({ ...base, id: `${grupo}-${mk}`, grupo, tipo, diaVenc: dia, venc: vencEm(mk, dia), ...(tipo === 'parcelada' ? { parcela: k + 1, parcelas: n } : {}) }));
    }
    tocados.forEach(mk => gravar('c-' + mk));
    if (tipo === 'fixa') estenderFixas();
    return n;
  }

  // Aplica a edição de uma conta fixa ou parcelada a ela e às ocorrências seguintes ainda não pagas.
  // Devolve quantas contas mudaram.
  function aplicarNaSerie(g, base) {
    const novoDia = Number(base.venc.slice(8));
    const mudouDia = novoDia !== Number(g.venc.slice(8));
    const seguintes = todas().filter(c => c.grupo === g.grupo && c.venc > g.venc && !c.pago);
    const tocados = new Set([tirar(g), colocar({ ...base, diaVenc: novoDia })]);
    seguintes.forEach(c => {
      const nova = { ...c, valor: base.valor, desc: base.desc, cat: base.cat, pag: base.pag, diaVenc: mudouDia ? novoDia : (c.diaVenc || novoDia) };
      if (base.estimado) nova.estimado = true; else delete nova.estimado;
      delete nova.exemplo;
      if (mudouDia) nova.venc = vencEm(mesDe(c.venc), novoDia);
      tocados.add(tirar(c));
      tocados.add(colocar(nova));
    });
    tocados.forEach(mk => gravar('c-' + mk));
    return seguintes.length + 1;
  }

  function alternarPaga(c) {
    const antes = { ...c };
    const nova = { ...c, pago: !c.pago };
    if (nova.pago) nova.pagoEm = isoHoje(); else delete nova.pagoEm;
    salvarConta(nova, c);
    render();
    toast(nova.pago ? `${c.desc || catOf(c.cat).nome} marcada como paga` : 'Conta voltou para a pagar', 'Desfazer', () => { salvarConta(antes, nova); render(); });
  }

  function carregarExemplos() {
    const hoje = isoHoje(), mk = mesDe(hoje);
    const modelos = [
      // desc, cat, valor, dia, pagamento, tipo, parcelas
      ['Aluguel', 'moradia', 145000, 5, 'Pix', 'fixa'],
      ['Condomínio', 'moradia', 48000, 10, 'Boleto', 'fixa'],
      ['Conta de luz', 'energia', 18740, 15, 'Débito automático', 'fixa'],
      ['Conta de água', 'agua', 9230, 18, 'Boleto', 'fixa'],
      ['Internet fibra', 'internet', 9990, 20, 'Débito automático', 'fixa'],
      ['Fatura do cartão', 'cartao', 213480, 25, 'Pix', 'fixa'],
      ['Plano de saúde', 'saude', 62000, 8, 'Boleto', 'fixa'],
      ['Mensalidade da escola', 'educacao', 89000, 12, 'Boleto', 'fixa'],
      ['Financiamento do carro', 'emprestimo', 116500, 28, 'Boleto', 'parcelada', 36],
      ['IPTU', 'impostos', 21300, 15, 'Boleto', 'parcelada', 10],
    ];
    const tocados = new Set();
    modelos.forEach(([desc, cat, valor, dia, pag, tipo, nParc]) => {
      const grupo = 'grp' + novoId();
      // começa 2 meses atrás; parcelas já em andamento
      const inicio = addMes(mk, -2);
      const total = tipo === 'parcelada' ? 3 + 2 : 3;  // 2 meses passados, o atual e (parcelas) 2 futuros
      const offsetParc = tipo === 'parcelada' ? (desc === 'IPTU' ? 4 : 12) : 0;
      for (let k = 0; k < total; k++) {
        const mkK = addMes(inicio, k);
        const venc = vencEm(mkK, dia);
        const passou = venc < hoje;
        // No mês atual, a conta de água fica vencida e sem pagar para mostrar o alerta.
        const pago = passou && !(mkK === mk && cat === 'agua');
        const c = { id: novoId() + k, grupo, tipo, diaVenc: dia, desc, cat, valor: cat === 'energia' || cat === 'agua' || cat === 'cartao' ? Math.round(valor * (0.85 + ((k * 7 + dia) % 6) * 0.05)) : valor, pag, venc, pago, exemplo: true };
        if (pago) c.pagoEm = vencEm(mkK, Math.max(1, dia - 1));
        // Luz, água e cartão ainda não pagos mostram o "valor a confirmar".
        if (!pago && ['energia', 'agua', 'cartao'].includes(cat)) c.estimado = true;
        if (tipo === 'parcelada') { c.parcela = offsetParc + k + 1; c.parcelas = nParc; }
        tocados.add(colocar(c));
      }
    });
    tocados.forEach(m => gravar('c-' + m));
    estenderFixas();
    render();
    toast('Exemplos adicionados. Remova em Ajustes quando quiser.');
  }
  function removerExemplos() {
    excluirContas(todas().filter(i => i.exemplo));
    render();
  }

  // ---------- Interface ----------
  let mesAtual = mesDe(isoHoje());
  let aba = 'mes';
  const $ = id => document.getElementById(id);

  function linhaConta(c, mostrarMes) {
    const s = situacao(c);
    const extra = c.tipo === 'parcelada' && c.parcelas ? `Parcela ${c.parcela}/${c.parcelas}` : c.tipo === 'fixa' ? 'Fixa mensal' : 'Avulsa';
    return `<div class="item ${s.k === 'paga' ? 'paga' : ''} ${s.k === 'vencida' ? 'vencida' : ''}">
      <button class="check" data-pagar="${esc(c.id)}" data-mes="${mesDe(c.venc)}" aria-label="${c.pago ? 'Desmarcar pagamento de' : 'Marcar como paga:'} ${esc(c.desc || catOf(c.cat).nome)}" aria-pressed="${!!c.pago}">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
      </button>
      <button class="abrir" data-id="${esc(c.id)}" data-mes="${mesDe(c.venc)}">
        ${selo(c.cat)}
        <span class="t"><em>${esc(c.desc || catOf(c.cat).nome)}</em>${c.exemplo ? '<span class="tag-ex">exemplo</span>' : ''}</span>
        <span class="v">${c.estimado && !c.pago ? '<span class="aprox" title="Valor estimado">~</span>' : ''}${fmt(c.valor)}</span>
        <span class="s">${c.estimado && !c.pago ? '<b class="a-confirmar">Valor a confirmar</b> · ' : ''}${mostrarMes ? 'Vence ' + ddmm(c.venc) + ' · ' : ''}${extra} · ${esc(c.pag || '')}</span>
        <span class="st ${s.k}">${s.t}</span>
      </button>
    </div>`;
  }

  function render() {
    const mkHoje = mesDe(isoHoje());
    const rotulo = nomeMes(mesAtual);
    $('month-label').textContent = rotulo.charAt(0).toUpperCase() + rotulo.slice(1);
    $('ir-hoje').hidden = mesAtual === mkHoje;
    $('view-mes').hidden = aba !== 'mes';
    $('view-prox').hidden = aba !== 'prox';
    $('tab-mes').setAttribute('aria-selected', aba === 'mes');
    $('tab-prox').setAttribute('aria-selected', aba === 'prox');
    const nVenc = todas().filter(c => situacao(c).k === 'vencida').length;
    $('dot-venc').hidden = !nVenc;
    $('dot-venc').textContent = nVenc;
    $('fab').hidden = false;
    if (aba === 'mes') renderMes(); else renderProx();
  }

  function renderMes() {
    const el = $('view-mes');
    if (carregando) {
      el.innerHTML = `<div class="empty"><h3>Carregando suas contas…</h3><p>Buscando o que está salvo na sua conta.</p></div>`;
      return;
    }
    if (!temDados()) {
      el.innerHTML = `
        <div class="empty">
          <h3>Nenhuma conta cadastrada</h3>
          <p>Cadastre aluguel, luz, cartão, parcelas e boletos com a data de vencimento. O app avisa o que está vencendo e soma o que falta pagar no mês.</p>
          <div class="row-btns">
            <button class="btn" data-act="novo">Cadastrar primeira conta</button>
            <button class="btn ghost" data-act="exemplos">Ver com exemplos</button>
          </div>
          <button class="btn ghost" data-act="restaurar">Restaurar de um backup</button>
        </div>`;
      return;
    }
    const itens = itensDo(mesAtual).slice().sort((a, b) => a.venc.localeCompare(b.venc) || a.valor - b.valor);
    const total = itens.reduce((s, i) => s + i.valor, 0);
    const pago = itens.filter(i => i.pago).reduce((s, i) => s + i.valor, 0);
    const falta = total - pago;
    const vencidas = itens.filter(i => situacao(i).k === 'vencida');
    const semana = itens.filter(i => ['hoje', 'logo'].includes(situacao(i).k));
    const renda = state.config.renda || 0;
    const sobra = renda - total;

    let pills = '';
    if (vencidas.length) pills += `<span class="pill bad">${vencidas.length} vencida${vencidas.length > 1 ? 's' : ''} · ${fmt(vencidas.reduce((s, i) => s + i.valor, 0))}</span>`;
    if (semana.length) pills += `<span class="pill warn">${semana.length} vence${semana.length > 1 ? 'm' : ''} em até 7 dias · ${fmt(semana.reduce((s, i) => s + i.valor, 0))}</span>`;
    if (total && !falta) pills += `<span class="pill ok">Tudo pago neste mês</span>`;
    if (!pills && total) pills = `<span class="pill">Nada vencendo nos próximos 7 dias</span>`;

    const grupos = [
      ['Vencidas', itens.filter(i => situacao(i).k === 'vencida')],
      ['A pagar', itens.filter(i => !i.pago && situacao(i).k !== 'vencida')],
      ['Pagas', itens.filter(i => i.pago)],
    ].filter(g => g[1].length);

    el.innerHTML = `
      <section class="cupom" aria-label="Resumo do mês">
        <div class="eyebrow">Falta pagar em ${esc(nomeMes(mesAtual).split(' de ')[0])}</div>
        <div class="total">${fmt(falta)}</div>
        <div class="budget-line"><span>${fmt(pago)} pagos de ${fmt(total)}</span><span class="num">${total ? Math.round((pago / total) * 100) + '%' : ''}</span></div>
        <div class="bar" role="progressbar" aria-label="Quanto já foi pago" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${total ? Math.round((pago / total) * 100) : 0}"><span style="width:${total ? (pago / total) * 100 : 0}%"></span></div>
        ${pills ? `<div class="pills">${pills}</div>` : ''}
        <hr class="dash">
        <div class="stats">
          <div><b>${itens.length}</b><span>contas no mês</span></div>
          <div><b>${fmt(total)}</b><span>total do mês</span></div>
          ${renda ? `<div><b class="${sobra < 0 ? 'neg' : ''}">${fmt(sobra)}</b><span>sobra da renda</span></div>` : `<div><b>${itens.filter(i => !i.pago).length}</b><span>em aberto</span></div>`}
        </div>
      </section>

      ${grupos.length ? grupos.map(([titulo, lista]) => `
        <section>
          <div class="section-head"><h2>${titulo}<span class="cnt">${lista.length}</span></h2><span class="note num">${fmt(lista.reduce((s, i) => s + i.valor, 0))}</span></div>
          <div class="items">${lista.map(c => linhaConta(c)).join('')}</div>
        </section>`).join('')
      : `<div class="empty"><p>Nenhuma conta com vencimento em ${esc(nomeMes(mesAtual))}.</p><button class="btn" data-act="novo">Cadastrar conta</button></div>`}`;
  }

  function renderProx() {
    const el = $('view-prox');
    const hoje = isoHoje(), mkHoje = mesDe(hoje);
    const abertas = todas().filter(c => !c.pago).sort((a, b) => a.venc.localeCompare(b.venc));
    const vencidas = abertas.filter(c => c.venc < hoje);
    const prox30 = abertas.filter(c => c.venc >= hoje && diaNum(c.venc) - diaNum(hoje) <= 30);

    const meses = [];
    for (let k = 0; k < 6; k++) meses.push(addMes(mkHoje, k));
    const totais = meses.map(mk => totalDe(mk));
    const pagos = meses.map(mk => totalDe(mk, i => i.pago));
    const renda = state.config.renda || 0;
    const topo = Math.max(renda, ...totais, 1) * 1.15;
    const W = 340, H = 190, base = 160, alto = 130, bw = 34, passo = (W - 20) / 6;
    const y = v => base - (v / topo) * alto;
    const barras = meses.map((mk, i) => {
      const x = 10 + passo * i + (passo - bw) / 2;
      const acima = renda && totais[i] > renda;
      const corAberto = acima ? 'var(--bad)' : 'var(--accent)';
      return `<rect x="${x}" y="${y(totais[i])}" width="${bw}" height="${Math.max(base - y(totais[i]), totais[i] ? 2 : 0)}" rx="5" fill="${corAberto}"/>
        ${pagos[i] ? `<rect x="${x}" y="${y(pagos[i])}" width="${bw}" height="${base - y(pagos[i])}" rx="5" fill="var(--ok)"/>` : ''}
        ${totais[i] ? `<text class="val" x="${x + bw / 2}" y="${y(totais[i]) - 6}" text-anchor="middle">${fmtCurto(totais[i])}</text>` : ''}
        <text x="${x + bw / 2}" y="${base + 18}" text-anchor="middle">${nomeMes(mk, true)}</text>`;
    }).join('');
    const linhaRenda = renda ? `<line x1="6" x2="${W - 6}" y1="${y(renda)}" y2="${y(renda)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>` : '';

    el.innerHTML = `
      ${vencidas.length ? `<section>
        <div class="section-head"><h2>Vencidas<span class="cnt">${vencidas.length}</span></h2><span class="note num">${fmt(vencidas.reduce((s, i) => s + i.valor, 0))}</span></div>
        <div class="items">${vencidas.map(c => linhaConta(c, true)).join('')}</div>
      </section>` : ''}
      <section>
        <div class="section-head"><h2>Próximos 30 dias<span class="cnt">${prox30.length}</span></h2><span class="note num">${fmt(prox30.reduce((s, i) => s + i.valor, 0))}</span></div>
        ${prox30.length ? `<div class="items">${prox30.map(c => linhaConta(c, true)).join('')}</div>` : `<div class="empty"><p>Nenhuma conta em aberto vence nos próximos 30 dias.</p></div>`}
      </section>
      <section>
        <div class="section-head"><h2>Compromissos dos próximos meses</h2></div>
        <div class="chart">
          <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Total de contas por mês, dos próximos seis meses">
            <line x1="6" x2="${W - 6}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="1"/>
            ${linhaRenda}${barras}
          </svg>
          <div class="legend"><span><i style="background:var(--accent)"></i>A pagar</span><span><i style="background:var(--ok)"></i>Pago</span>${renda ? `<span><i class="lr"></i>Renda ${fmt(renda)}</span><span><i style="background:var(--bad)"></i>Acima da renda</span>` : ''}</div>
        </div>
      </section>`;
  }

  // ---------- Folhas ----------
  function abrirFolha(html, aoMontar) {
    const layer = $('layer');
    layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
    $('scrim').addEventListener('click', e => { if (e.target.id === 'scrim') fecharFolha(); });
    layer.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', fecharFolha));
    document.body.style.overflow = 'hidden';
    aoMontar && aoMontar(layer);
  }
  function fecharFolha() { $('layer').innerHTML = ''; document.body.style.overflow = ''; }
  const cabecalho = t => `<div class="sheet-head"><h2>${t}</h2><button class="close" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
  const mascaraValor = (inp, inicial, max) => {
    let c = inicial;
    inp.addEventListener('input', () => {
      c = Number(inp.value.replace(/\D/g, '').slice(0, max || 9) || 0);
      inp.value = (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
    });
    inp.addEventListener('focus', () => setTimeout(() => inp.setSelectionRange(inp.value.length, inp.value.length), 0));
    return () => c;
  };

  // ---------- Categorias personalizadas ----------
  // Editor usado no cadastro de conta (prefixo "g") e em Ajustes (prefixo "a").
  function htmlEditorCategoria(p) {
    return `<div class="editor-cat">
      <div class="field"><label for="${p}-cat-nome">Nome da nova categoria</label><input class="input" id="${p}-cat-nome" maxlength="30" placeholder="Ex.: Pet, Academia, Carro" autocomplete="off"></div>
      <div class="field"><span class="lbl" id="${p}-lbl-ico">Ícone</span>
        <div class="icones" role="radiogroup" aria-labelledby="${p}-lbl-ico" id="${p}-cat-icone">
          ${Object.keys(ICONES).map((n, i) => `<button type="button" class="ico-btn" role="radio" data-v="${n}" aria-checked="${i === 10}" aria-label="Ícone ${n}">${icone(n, 20)}</button>`).join('')}
        </div>
      </div>
      <div class="field"><span class="lbl" id="${p}-lbl-cor">Cor</span>
        <div class="cores" role="radiogroup" aria-labelledby="${p}-lbl-cor" id="${p}-cat-cor">
          ${CORES_CAT.map((c, i) => `<button type="button" class="cor-btn cor-btn-p" role="radio" data-v="${c}" aria-checked="${i === 0}" aria-label="Cor ${i + 1}" style="background:var(--c-${c})"></button>`).join('')}
        </div>
      </div>
      <div class="err" id="${p}-cat-err" role="alert"></div>
      <button type="button" class="btn ghost" id="${p}-cat-criar">Criar categoria</button>
    </div>`;
  }
  const htmlListaCategorias = () => catsPessoais().length
    ? catsPessoais().map(c => `<div class="cat-linha">${selo(c.id)}<span class="n">${esc(c.nome)}</span><button type="button" data-excluir="${esc(c.id)}">Excluir</button></div>`).join('')
    : `<p class="note" style="margin:0">Além das categorias prontas, crie as suas, como Pet, Academia ou Carro. Elas aparecem na hora de cadastrar uma conta.</p>`;
  function ligarEditorCategoria(p, aoCriar) {
    const escolha = { icone: Object.keys(ICONES)[10], cor: CORES_CAT[0] };
    [['icone', `${p}-cat-icone`], ['cor', `${p}-cat-cor`]].forEach(([k, id]) => $(id).addEventListener('click', e => {
      const b = e.target.closest('button[data-v]'); if (!b) return;
      escolha[k] = b.dataset.v;
      $(id).querySelectorAll('button[data-v]').forEach(x => x.setAttribute('aria-checked', x === b));
    }));
    $(`${p}-cat-criar`).addEventListener('click', () => {
      const nome = $(`${p}-cat-nome`).value.trim();
      if (!nome) { $(`${p}-cat-err`).textContent = 'Dê um nome para a categoria.'; $(`${p}-cat-nome`).focus(); return; }
      if (todasCats().some(c => c.nome.toLocaleLowerCase('pt-BR') === nome.toLocaleLowerCase('pt-BR'))) { $(`${p}-cat-err`).textContent = 'Já existe uma categoria com esse nome.'; return; }
      const cat = { id: 'u' + novoId(), nome, icone: escolha.icone, cor: escolha.cor };
      state.config = { ...state.config, categorias: catsPessoais().concat(cat) };
      gravar('config');
      $(`${p}-cat-nome`).value = '';
      $(`${p}-cat-err`).textContent = '';
      aoCriar(cat);
    });
  }

  function abrirConta(g) {
    const editando = !!g;
    const vencPadrao = mesAtual === mesDe(isoHoje()) ? isoHoje() : `${mesAtual}-10`;
    const atual = g ? { ...g } : { id: novoId(), valor: 0, desc: '', cat: 'moradia', pag: 'Boleto', venc: vencPadrao, pago: false };
    let tipo = 'unica';
    const temSerie = editando && g.grupo;
    abrirFolha(`
      ${cabecalho(editando ? 'Editar conta' : 'Nova conta a pagar')}
      <form id="f-conta" novalidate style="display:grid;gap:14px">
        <div class="amount-wrap"><span>R$</span><input class="amount" id="g-valor" inputmode="numeric" autocomplete="off" aria-label="Valor" value="${(atual.valor / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}"></div>
        <div class="field"><label for="g-desc">Descrição</label><input class="input" id="g-desc" maxlength="60" placeholder="Ex.: Aluguel, conta de luz, fatura do cartão" value="${esc(atual.desc)}" autocomplete="off"></div>
        <div class="field"><span class="lbl" id="lbl-cat">Categoria</span>
          <div class="chips" role="radiogroup" aria-labelledby="lbl-cat" id="g-cats">
            ${todasCats().map(c => `<button type="button" class="chip" role="radio" data-v="${c.id}" aria-checked="${c.id === atual.cat}">${selo(c.id, 14)}${esc(c.nome)}</button>`).join('')}
            <button type="button" class="chip chip-nova" id="g-nova-cat" aria-expanded="false">+ Nova categoria</button>
          </div>
          <div id="g-editor-cat" hidden>${htmlEditorCategoria('g')}</div>
        </div>
        <div class="two">
          <div class="field"><label for="g-venc">Vencimento</label><input class="input" type="date" id="g-venc" value="${atual.venc}"></div>
          <div class="field"><label for="g-pag">Pagar com</label><select class="input" id="g-pag">${PAGS.map(p => `<option${p === atual.pag ? ' selected' : ''}>${p}</option>`).join('')}</select></div>
        </div>
        <label class="toggle"><input type="checkbox" id="g-est" ${atual.estimado ? 'checked' : ''}> <span>Valor estimado<small class="note">Para contas que mudam todo mês, como luz, água e cartão. O app marca "valor a confirmar" e o aviso lembra de atualizar quando a fatura chegar.</small></span></label>
        ${editando ? (temSerie ? `<div class="field"><span class="lbl" id="lbl-escopo">${g.tipo === 'parcelada' ? `Parcela ${g.parcela} de ${g.parcelas}` : 'Conta fixa mensal'} · aplicar alterações a</span>
          <div class="seg seg-2" role="radiogroup" aria-labelledby="lbl-escopo" id="g-escopo">
            <button type="button" role="radio" data-v="este" aria-checked="true">Só este mês</button>
            <button type="button" role="radio" data-v="proximos" aria-checked="false">Este e os próximos</button>
          </div>
          <span class="note" id="g-escopo-info" hidden>Valor, descrição, categoria, forma de pagamento e dia de vencimento mudam neste mês e nos seguintes que ainda não foram pagos. Os meses anteriores ficam como estão.</span>
        </div>` : '') : `
        <div class="field"><span class="lbl" id="lbl-rep">Repetição</span>
          <div class="seg" role="radiogroup" aria-labelledby="lbl-rep" id="g-tipo">
            <button type="button" role="radio" data-v="unica" aria-checked="true">Só uma vez</button>
            <button type="button" role="radio" data-v="fixa" aria-checked="false">Todo mês</button>
            <button type="button" role="radio" data-v="parcelada" aria-checked="false">Parcelada</button>
          </div>
        </div>
        <div class="field" id="box-parc" hidden><label for="g-parc">Número de parcelas</label><input class="input" type="number" id="g-parc" min="2" max="72" value="10" inputmode="numeric"><span class="note" id="parc-info"></span></div>`}
        <label class="toggle"><input type="checkbox" id="g-pago" ${atual.pago ? 'checked' : ''}> Já está paga</label>
        <div class="field" id="box-pagoem" ${atual.pago ? '' : 'hidden'}><label for="g-pagoem">Paga em</label><input class="input" type="date" id="g-pagoem" value="${atual.pagoEm || isoHoje()}"></div>
        <div class="err" id="g-err" role="alert"></div>
        <div class="sheet-actions">
          <button type="submit" class="btn">${editando ? 'Salvar alterações' : 'Cadastrar conta'}</button>
        </div>
        ${editando ? `<div class="sheet-actions">
          <button type="button" class="btn danger" id="g-del">${temSerie ? 'Excluir só este mês' : 'Excluir conta'}</button>
          ${temSerie ? `<button type="button" class="btn danger" id="g-del-serie">Excluir esta e as próximas</button>` : ''}
        </div>` : ''}
      </form>`, () => {
      const valor = mascaraValor($('g-valor'), atual.valor);
      if (!editando) setTimeout(() => $('g-valor').focus(), 60);
      const escolherCat = b => {
        atual.cat = b.dataset.v;
        $('g-cats').querySelectorAll('.chip[data-v]').forEach(c => c.setAttribute('aria-checked', c === b));
      };
      $('g-cats').addEventListener('click', e => {
        if (e.target.closest('#g-nova-cat')) {
          const ed = $('g-editor-cat');
          ed.hidden = !ed.hidden;
          $('g-nova-cat').setAttribute('aria-expanded', !ed.hidden);
          if (!ed.hidden) $('g-cat-nome').focus();
          return;
        }
        const b = e.target.closest('.chip[data-v]'); if (b) escolherCat(b);
      });
      ligarEditorCategoria('g', cat => {
        $('g-nova-cat').insertAdjacentHTML('beforebegin', `<button type="button" class="chip" role="radio" data-v="${cat.id}" aria-checked="false">${selo(cat.id, 14)}${esc(cat.nome)}</button>`);
        escolherCat($('g-cats').querySelector(`[data-v="${cat.id}"]`));
        $('g-editor-cat').hidden = true;
        $('g-nova-cat').setAttribute('aria-expanded', 'false');
        toast(`Categoria ${cat.nome} criada`);
      });
      const parcInfo = () => {
        const n = Number($('g-parc').value) || 0;
        $('parc-info').textContent = n >= 2 && valor() ? `${n}× de ${fmt(valor())}, de ${nomeMes(mesDe($('g-venc').value || vencPadrao))} a ${nomeMes(addMes(mesDe($('g-venc').value || vencPadrao), n - 1))}. Informe o valor de cada parcela.` : 'Informe o valor de cada parcela.';
      };
      if (!editando) {
        $('g-tipo').addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b) return;
          tipo = b.dataset.v;
          $('g-tipo').querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', x === b));
          $('box-parc').hidden = tipo !== 'parcelada';
          parcInfo();
        });
        ['g-parc', 'g-venc', 'g-valor'].forEach(id => $(id).addEventListener('input', parcInfo));
      }
      $('g-pago').addEventListener('change', () => { $('box-pagoem').hidden = !$('g-pago').checked; });
      // Ao digitar o valor real de uma conta estimada, ela passa a ser valor confirmado.
      if (editando && g.estimado) $('g-valor').addEventListener('input', () => { $('g-est').checked = false; });
      let escopo = 'este';
      if (temSerie) $('g-escopo').addEventListener('click', e => {
        const b = e.target.closest('button[data-v]'); if (!b) return;
        escopo = b.dataset.v;
        $('g-escopo').querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', x === b));
        $('g-escopo-info').hidden = escopo !== 'proximos';
      });

      const armar = (btn, acao) => btn && btn.addEventListener('click', () => {
        if (!btn.classList.contains('armed')) { btn.classList.add('armed'); btn.textContent = 'Toque para confirmar'; return; }
        acao();
      });
      armar($('g-del'), () => {
        excluirContas([g]); fecharFolha(); render();
        toast('Conta excluída', 'Desfazer', () => { salvarConta(g); render(); });
      });
      armar($('g-del-serie'), () => {
        const serie = todas().filter(c => c.grupo === g.grupo && c.venc >= g.venc);
        if (g.tipo === 'fixa') { state.config = { ...state.config, encerradas: state.config.encerradas.concat(g.grupo) }; gravar('config'); }
        excluirContas(serie); fecharFolha(); render();
        toast(`${serie.length} conta${serie.length > 1 ? 's' : ''} excluída${serie.length > 1 ? 's' : ''}`);
      });

      $('f-conta').addEventListener('submit', e => {
        e.preventDefault();
        const venc = $('g-venc').value;
        const pago = $('g-pago').checked;
        if (!valor()) { $('g-err').textContent = 'Informe um valor maior que zero.'; $('g-valor').focus(); return; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(venc)) { $('g-err').textContent = 'Escolha a data de vencimento.'; return; }
        const nParc = Math.round(Number(editando ? 0 : $('g-parc').value));
        if (!editando && tipo === 'parcelada' && !(nParc >= 2 && nParc <= 72)) { $('g-err').textContent = 'Use de 2 a 72 parcelas.'; return; }
        const base = { ...atual, valor: valor(), desc: $('g-desc').value.trim(), pag: $('g-pag').value, venc, pago, estimado: $('g-est').checked };
        if (!base.estimado) delete base.estimado;
        if (pago) base.pagoEm = $('g-pagoem').value || isoHoje(); else delete base.pagoEm;
        let msg;
        if (editando && escopo === 'proximos') {
          delete base.exemplo;
          const n = aplicarNaSerie(g, base);
          msg = n > 1 ? `Alterações salvas neste mês e em mais ${n - 1}` : 'Alterações salvas';
        } else if (editando) {
          delete base.exemplo;
          if (g.diaVenc && mesDe(venc) === mesDe(g.venc)) base.diaVenc = g.diaVenc;
          salvarConta(base, g);
          msg = 'Alterações salvas';
        } else {
          const n = criarContas(base, tipo, nParc);
          msg = tipo === 'parcelada' ? `${n} parcelas cadastradas` : tipo === 'fixa' ? 'Conta fixa cadastrada para os próximos meses' : 'Conta cadastrada';
        }
        mesAtual = mesDe(venc);
        fecharFolha(); render();
        toast(msg);
      });
    });
  }

  // ---------- Avisos de vencimento (notificações) ----------
  const OPCOES_AVISO = [{ v: 3, t: '3 dias antes' }, { v: 1, t: '1 dia antes' }, { v: 0, t: 'No dia' }];
  const idAvisoLocal = () => {
    const s = lsGet(LS_AVISO) || '';
    return usuario && s.startsWith(usuario.uid + ':') ? s.slice(usuario.uid.length + 1) : null;
  };
  const avisosAtivosAqui = () => !!idAvisoLocal() && typeof Notification !== 'undefined' && Notification.permission === 'granted';
  const ehIphoneNoNavegador = () => /iPhone|iPad|iPod/.test(navigator.userAgent) && !(navigator.standalone || matchMedia('(display-mode: standalone)').matches);

  function htmlAvisos() {
    if (!window.Nuvem || !Nuvem.configurado) return '';
    let estado;
    if (modo !== 'conta') estado = `<div class="status"><i></i><span>Entre na sua conta para receber avisos de vencimento no celular.</span></div>`;
    else if (!Nuvem.avisosConfigurados) estado = `<div class="status"><i></i><span>Os avisos ainda não foram configurados neste app.</span></div>`;
    else if (!Nuvem.pushSuportado) estado = `<div class="status"><i></i><span>${ehIphoneNoNavegador()
      ? 'No iPhone, os avisos só funcionam no app da Tela de Início: no Safari, toque em Compartilhar → Adicionar à Tela de Início e abra o app por lá.'
      : 'Este navegador não aceita notificações. No Android, use o Chrome.'}</span></div>`;
    else if (Notification.permission === 'denied') estado = `<div class="status"><i></i><span>As notificações deste site estão bloqueadas. Libere nas configurações do navegador (toque no cadeado ao lado do endereço → Notificações) e volte aqui.</span></div>`;
    else if (avisosAtivosAqui()) estado = `<div class="status on"><i></i><span>Avisos ativados neste celular. Eles chegam uma vez por dia, por volta das 8h.</span></div>
      <button class="btn ghost" id="a-av-off">Desativar avisos neste celular</button>`;
    else estado = `<p class="note" style="margin:0">Receba uma notificação quando uma conta estiver perto de vencer, mesmo com o app fechado.</p>
      <button class="btn" id="a-av-on">Ativar avisos neste celular</button>`;
    const n = state.config.notif || CONFIG_PADRAO.notif;
    const prefs = modo === 'conta' ? `
      <div class="field"><span class="lbl" id="lbl-av">Quando avisar</span>
        <div class="chips" role="group" aria-labelledby="lbl-av" id="a-av-prefs">
          ${OPCOES_AVISO.map(o => `<button type="button" class="chip" role="checkbox" data-dia="${o.v}" aria-checked="${(n.dias || []).includes(o.v)}">${o.t}</button>`).join('')}
          <button type="button" class="chip" role="checkbox" data-venc="1" aria-checked="${n.vencidas !== false}">Contas vencidas</button>
        </div>
        <span class="note">Vale para todos os aparelhos em que você ativar os avisos.</span>
      </div>` : '';
    return `<h2>Avisos de vencimento</h2>${estado}<div class="err" id="a-av-msg" role="alert"></div>${prefs}<hr class="dash" style="margin:2px 0">`;
  }

  function ligarAvisos() {
    const msg = t => { const m = $('a-av-msg'); if (m) m.textContent = t; };
    const on = $('a-av-on');
    if (on) on.addEventListener('click', async () => {
      on.disabled = true; on.textContent = 'Ativando…'; msg('');
      try {
        const id = await Nuvem.ativarAvisos(usuario.uid);
        lsSet(LS_AVISO, usuario.uid + ':' + id);
        // Grava as preferências na conta para o robô saber quando avisar.
        state.config = { ...state.config, notif: state.config.notif || CONFIG_PADRAO.notif };
        gravar('config');
        fecharFolha(); abrirAjustes();
        toast('Avisos ativados neste celular');
      } catch (e) {
        on.disabled = false; on.textContent = 'Ativar avisos neste celular';
        msg(e.message);
      }
    });
    const off = $('a-av-off');
    if (off) off.addEventListener('click', async () => {
      off.disabled = true;
      try { await Nuvem.desativarAvisos(usuario.uid, idAvisoLocal()); } catch (e) {}
      lsSet(LS_AVISO, null);
      fecharFolha(); abrirAjustes();
